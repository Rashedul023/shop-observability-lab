server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static React files
    location / {
        try_files $uri /index.html;
    }

    # API calls go to the order-service (name resolved by Docker / Kubernetes DNS)
    location /api/ {
        proxy_pass http://order-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
